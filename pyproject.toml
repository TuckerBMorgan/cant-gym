[project]
name = "dqn-cartpole"
version = "0.1.0"
description = "DQN reinforcement learning for CartPole"
requires-python = ">=3.10"

dependencies = [
    "gymnasium[classic-control]",
    "numpy",
    "typing-extensions",
    "torch>=2.7.0",
    "torchvision>=0.22.0",
    "matplotlib",
    "gguf"
]

[project.scripts]
dqn-train = "python.scripts.train:main"
dqn-eval = "python.scripts.evaluate:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["python*"]
