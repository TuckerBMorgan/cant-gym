[project]
name = "my-rl-project"
version = "0.1.0"
description = "Reinforcement learning project using Gymnasium"
authors = [
    { name = "Your Name" }
]
readme = "README.md"
requires-python = ">=3.10"

# Core dependencies
dependencies = [
    "gymnasium[classic-control]",
    "numpy",
    "typing-extensions",
    "torch>=2.7.0",
    "torchvision>=0.22.0",
    "matplotlib",
    "gguf"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
